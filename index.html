<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes"/>
<title>🦊 Safia's Science Trail</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="wrap">

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-title"><span class="home-link" onclick="goHome()">🦊 Safia's Science Trail</span></div>
  <div class="topbar-btns">
    <button class="tb-btn" onclick="saveProgress()">💾 Save</button>
    <button class="tb-btn" onclick="loadProgress()">📂 Load</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="loadFile(event)">
  </div>
  <div class="tb-lbl" id="saveLbl">⭐ 0 stars</div>
</div>

<!-- HOME SCREEN: choose grade -->
<div class="screen active" id="homeScreen">
  <div class="home-hero">
    <div class="hero-emoji">🦊🔬</div>
    <h1>Scout's Science Trail</h1>
    <p>Pick your grade and start exploring!</p>
  </div>
  <div class="grade-grid" id="gradeGrid"></div>
</div>

<!-- GRADE HOME SCREEN: choose strand -->
<div class="screen" id="gradeHomeScreen">
  <div class="scout-bubble">
    <div class="scout-avatar">🦊</div>
    <div class="scout-text" id="scoutMsg">Hi Safia! Pick a trail to explore today!</div>
  </div>
  <div class="strand-grid" id="strandGrid"></div>
  <div class="progress-dash" id="progressChart"></div>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn btn-back" onclick="goHome()">← All Grades</button>
  </div>
</div>

<!-- STRAND SCREEN: choose unit -->
<div class="screen" id="strandScreen">
  <div class="strand-head">
    <div class="sh-icon" id="strandIcon">⚡</div>
    <div class="sh-name" id="strandName">Physical Science</div>
  </div>
  <div class="unit-grid" id="unitGrid"></div>
  <div class="btn-row">
    <button class="btn btn-back" onclick="showGradeHome()">← Back to Trails</button>
  </div>
</div>

<!-- UNIT SCREEN: the winding skill trail -->
<div class="screen" id="unitScreen">
  <div class="trail-wrap">
    <div class="trail-title" id="unitTitle">Animals</div>
    <div class="trail-sub" id="unitSub">Tap a stop to play!</div>
    <div class="trail-path" id="trailPath"></div>
  </div>
  <div class="btn-row" style="margin-top:14px">
    <button class="btn btn-back" onclick="showStrand()">← Back to Units</button>
  </div>
</div>

<!-- QUIZ SCREEN -->
<div class="screen" id="quizScreen">
  <div class="quiz-head">
    <div class="quiz-meta">
      <span id="quizLabel">Animals • What do animals need to survive?</span>
      <span id="quizQNum">Q 1 / 5</span>
    </div>
    <div class="quiz-score-row">
      <div class="qs-item"><div class="qs-label">✅ Correct</div><div class="qs-val" id="qsCorrect">0</div></div>
      <div class="qs-item"><div class="qs-label">🤔 Try Again</div><div class="qs-val" id="qsWrong">0</div></div>
      <div class="qs-item"><div class="qs-label">📊 Progress</div><div class="qs-val" id="qsAcc">—</div></div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="q-card" id="qCard"></div>
  <div class="hint-box" id="hintBox"></div>
  <div class="feedback" id="feedback"></div>
  <div class="explanation" id="explanation"></div>
  <div class="btn-row">
    <button class="btn btn-back" onclick="leaveQuiz()">🏠 Trail</button>
    <button class="btn btn-hint" id="hintBtn" onclick="showHint()">💡 Friendly Hint</button>
    <button class="btn btn-fun" id="funFactBtn" onclick="showFunFact()" style="display:none">🎉 Fun Fact</button>
    <button class="btn btn-check" id="checkBtn" onclick="checkAnswer()">✅ Check</button>
    <button class="btn btn-next" id="nextBtn" onclick="nextQuestion()">▶ Next</button>
  </div>
</div>

<!-- RESULT SCREEN -->
<div class="screen" id="resultScreen">
  <div class="result-card">
    <div class="result-emoji" id="resEmoji">🏆</div>
    <div class="result-title" id="resTitle">Great Job!</div>
    <div class="result-pct" id="resPct">0%</div>
    <div class="result-stars" id="resStars">⭐⭐⭐</div>
    <div class="result-msg" id="resMsg"></div>
    <div class="mistake-section" id="mistakeSection"></div>
    <div class="btn-row" style="justify-content:center;margin-top:16px">
      <button class="btn btn-back" id="retryBtn">🔁 Try Again</button>
      <button class="btn btn-check" onclick="showUnitFromResult()">🗺️ Trail</button>
      <button class="btn btn-next" id="nextLvBtn" style="display:none">➡ Next Skill</button>
    </div>
  </div>
</div>

</div>

<script src="data/g1-units.js"></script>
<script src="data/g1-physical.js"></script>
<script src="data/g1-life.js"></script>
<script src="data/g1-earth.js"></script>
<script src="data/g1-extra.js"></script>
<script src="data/g2-units.js"></script>
<script src="data/g2-physical.js"></script>
<script src="data/g2-life.js"></script>
<script src="data/g2-earth.js"></script>
<script src="data/g3-units.js"></script>
<script src="data/g3-physical.js"></script>
<script src="data/g3-life.js"></script>
<script src="data/g3-earth.js"></script>
<script src="app.js"></script>
</body>
</html>
